<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday — KATSEYE Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e0518;
    --ink2:#170a26;
    --pink:#ff2f87;
    --lime:#c8ff3d;
    --gold:#ffcb3f;
    --violet:#8a3ffc;
    --cream:#fff6ec;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 15% 10%, rgba(138,63,252,0.35), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(255,47,135,0.30), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(200,255,61,0.15), transparent 55%),
      var(--ink);
    color:var(--cream);
    font-family:'Space Grotesk', sans-serif;
    overflow-x:hidden;
  }

  /* ---------- floating cat-eye / star icons ---------- */
  .icon-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }
  .floater{
    position:absolute;
    font-size:2rem;
    opacity:0.55;
    filter:drop-shadow(0 0 10px rgba(255,255,255,0.15));
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{ transform:translate(0,100vh) rotate(0deg); }
    100%{ transform:translate(var(--dx,40px), -15vh) rotate(360deg); }
  }

  /* ---------- layout ---------- */
  .stage{
    position:relative;
    z-index:2;
    max-width:760px;
    margin:0 auto;
    padding:56px 24px 90px;
    text-align:center;
  }

  .kicker{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 16px;
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    font-size:0.85rem;
    letter-spacing:0.03em;
    color:var(--lime);
    margin-bottom:28px;
  }

  /* ---------- title with letter effects ---------- */
  h1.title{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:clamp(2.1rem, 8vw, 4.2rem);
    line-height:1.05;
    margin:0 0 18px;
    text-shadow:0 0 24px rgba(255,47,135,0.35);
  }
  h1.title .word{ display:inline-block; margin:0 6px; }
  h1.title .letter{
    display:inline-block;
    animation:bounceIn 0.6s ease both, wave 3.2s ease-in-out infinite;
    background:linear-gradient(180deg, var(--gold), var(--pink) 60%, var(--violet));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  @keyframes bounceIn{
    0%{ opacity:0; transform:translateY(40px) scale(0.6) rotate(-8deg); }
    70%{ opacity:1; transform:translateY(-6px) scale(1.05) rotate(2deg); }
    100%{ opacity:1; transform:translateY(0) scale(1) rotate(0deg); }
  }
  @keyframes wave{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }

  .subtitle{
    font-size:1.05rem;
    color:rgba(255,246,236,0.85);
    max-width:520px;
    margin:0 auto 40px;
    line-height:1.6;
  }
  .subtitle strong{ color:var(--lime); }

  /* ---------- player frame ---------- */
  .player-wrap{
    position:relative;
    margin:0 auto 22px;
    max-width:560px;
  }
  .cat-frame{
    position:relative;
    border-radius:28px;
    padding:10px;
    background:linear-gradient(135deg, var(--pink), var(--violet) 55%, var(--gold));
    box-shadow:0 20px 60px rgba(138,63,252,0.35);
  }
  .cat-frame::before, .cat-frame::after{
    content:"";
    position:absolute;
    width:26px;
    height:26px;
    background:var(--gold);
    border-radius:50%;
    top:-10px;
    box-shadow:0 0 14px rgba(255,203,63,0.8);
  }
  .cat-frame::before{ left:-10px; }
  .cat-frame::after{ right:-10px; }

  .video-shell{
    position:relative;
    width:100%;
    padding-top:56.25%;
    border-radius:20px;
    overflow:hidden;
    background:#000;
  }
  .video-shell iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }

  .sound-note{
    font-size:0.85rem;
    color:rgba(255,246,236,0.6);
    margin-top:14px;
  }
  .sound-note button{
    background:none;
    border:1px solid rgba(255,246,236,0.4);
    color:var(--cream);
    padding:6px 14px;
    border-radius:999px;
    font-family:'Space Grotesk',sans-serif;
    font-size:0.85rem;
    cursor:pointer;
    margin-left:8px;
  }
  .sound-note button:hover{ border-color:var(--lime); color:var(--lime); }

  footer{
    position:relative;
    z-index:2;
    text-align:center;
    padding:20px;
    font-size:0.8rem;
    color:rgba(255,246,236,0.4);
  }

  @media (prefers-reduced-motion: reduce){
    .letter, .floater{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="icon-layer" id="iconLayer"></div>

<div class="stage">
  <div class="kicker">🐆 KATSEYE · WILD ERA</div>

  <h1 class="title" id="titleText"></h1>

  <p class="subtitle">
    This one's a <strong>KATSEYE</strong> birthday. Press play on
    <strong>"Hootie Frutti,"</strong> the newest single off their EP
    <strong>WILD</strong>, and let the wild era kick off the celebration.
  </p>

  <div class="player-wrap">
    <div class="cat-frame">
      <div class="video-shell">
        <iframe
          id="ytPlayer"
          src="https://www.youtube.com/embed/is8UDe2PhKQ?autoplay=1&mute=1&playsinline=1&rel=0"
          title="KATSEYE - Hootie Frutti Official MV"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>
    <p class="sound-note">
      <button id="unmuteBtn">Unmute 🔊</button>
    </p>
  </div>
</div>

<footer>Made with 🐾 for a KATSEYE fan · video streamed directly from YouTube</footer>

<script>
  // ---------- animated title ----------
  const titleEl = document.getElementById('titleText');

  function renderTitle(name){
    const text = `Happy Birthday, ${name}!`;
    titleEl.innerHTML = '';
    let letterIndex = 0;
    text.split(' ').forEach((word) => {
      const wordSpan = document.createElement('span');
      wordSpan.className = 'word';
      word.split('').forEach((ch) => {
        const span = document.createElement('span');
        span.className = 'letter';
        span.textContent = ch;
        span.style.animationDelay = `${letterIndex * 0.05}s, ${0.6 + letterIndex * 0.08}s`;
        wordSpan.appendChild(span);
        letterIndex++;
      });
      titleEl.appendChild(wordSpan);
    });
  }

  renderTitle('Dinah');

  // ---------- unmute control ----------
  document.getElementById('unmuteBtn').addEventListener('click', () => {
    const frame = document.getElementById('ytPlayer');
    frame.src = frame.src.replace('mute=1', 'mute=0');
  });

  // ---------- floating icons ----------
  const icons = ['🐆','⭐','✨','👁️','💜','🦄','🎂','💗'];
  const layer = document.getElementById('iconLayer');
  const count = window.innerWidth < 600 ? 12 : 20;

  for(let i = 0; i < count; i++){
    const el = document.createElement('span');
    el.className = 'floater';
    el.textContent = icons[Math.floor(Math.random() * icons.length)];
    const left = Math.random() * 100;
    const duration = 14 + Math.random() * 14;
    const delay = Math.random() * -20;
    const dx = (Math.random() * 160 - 80) + 'px';
    const size = 1.2 + Math.random() * 1.8;
    el.style.left = left + 'vw';
    el.style.setProperty('--dx', dx);
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = delay + 's';
    el.style.fontSize = size + 'rem';
    layer.appendChild(el);
  }
</script>

</body>
</html>

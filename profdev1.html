<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year 1 of Professional Development</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f4f6f8;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: #333;
            font-size: 2.5rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .module-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .text-box {
            border: 2px solid #d9d9d9;
            border-radius: 15px;
            padding: 20px;
            min-height: 120px;
            margin-bottom: 15px;
            background-color: #fafafa;
        }

        .text-box h2 {
            margin-top: 0;
            color: #2c3e50;
        }

        .text-box p {
            color: #666;
        }

        .module-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Year 1 of Professional Development</h1>
    </header>

    <div class="grid-container">

        <div class="module-card">
            <div class="text-box">
                <h2>Module 1</h2>
                <p>Add your module description here.</p>
            </div>
            <img src="billy.png"
                 alt="Module 1 Image"
                 class="module-image">
        </div>

        <div class="module-card">
            <div class="text-box">
                <h2>Module 2</h2>
                <p>Add your module description here.</p>
            </div>
            <img src="https://via.placeholder.com/400x220?text=Module+2+Image"
                 alt="Module 2 Image"
                 class="module-image">
        </div>

        <div class="module-card">
            <div class="text-box">
                <h2>Module 3</h2>
                <p>Add your module description here.</p>
            </div>
            <img src="https://via.placeholder.com/400x220?text=Module+3+Image"
                 alt="Module 3 Image"
                 class="module-image">
        </div>

        <div class="module-card">
            <div class="text-box">
                <h2>Module 4</h2>
                <p>Add your module description here.</p>
            </div>
            <img src="https://via.placeholder.com/400x220?text=Module+4+Image"
                 alt="Module 4 Image"
                 class="module-image">
        </div>

    </div>

</body>
</html>
